<style>
:root{color-scheme:dark;--bg:#0d130f;--ink:#d8e2c8;--fire:#ff8a3d;--blood:#b3261e;--pine:#27412c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;font-family:Georgia,'Trebuchet MS',serif}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;overflow:auto;touch-action:pan-y;background:radial-gradient(circle at 50% 20%,#1d3324,#070b08);z-index:5;padding:16px}
.scr.on{display:flex;align-items:flex-start;justify-content:center}
#lb,.card{width:min(460px,100%);margin:auto;display:flex;flex-direction:column;gap:10px}
.card{background:#121c15;border:1px solid #2f4a35;padding:22px;border-radius:10px}
.pn{background:#121c15cc;border:1px solid #2f4a35;border-radius:10px;padding:10px}
h1{font-size:34px;color:var(--fire)}small{opacity:.65}
input,button,select{width:100%;padding:12px;border-radius:6px;border:1px solid #38553e;background:#0b120d;color:var(--ink);font-size:16px}
button{background:var(--pine);cursor:pointer}
button.hot{background:var(--fire);color:#1a0e04;font-weight:bold;border:0}
.go{font-size:22px;padding:16px;letter-spacing:3px;transform:skewX(-8deg)}
.row{display:flex;gap:8px}.row>*{flex:1}
#lbt{display:flex;align-items:center;gap:10px;background:#101a13;border:1px solid #2f4a35;padding:10px;border-radius:10px}
#lbt button{width:auto}
.av{width:46px;height:46px;border-radius:50%;border:2px solid var(--fire);flex:none}
#modes{display:flex;gap:6px}#modes button.sel{background:var(--fire);color:#1a0e04;border-color:#fff}.mc.sel{border-color:var(--fire);box-shadow:0 0 0 2px var(--fire)}.mc b,.mc small{text-shadow:0 1px 3px #000}
#maps{display:flex;gap:8px;overflow:auto;padding:4px 0}
.mc{flex:0 0 138px;background:#0b120d;border:2px solid #38553e;border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.slot{padding:8px;margin:4px 0;background:#0b120d;border-radius:6px;font-size:14px;border-left:3px solid var(--fire)}
#code{font-size:26px;letter-spacing:4px;color:var(--fire)}
.sw{height:34px;border-radius:6px;cursor:pointer;border:2px solid transparent}.sw.sel{border-color:#fff}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
.bar{position:absolute;left:12px;width:150px;height:10px;background:#0008;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%}
#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;text-align:right;font-size:14px;text-shadow:0 1px 4px #000}
#msg{position:absolute;top:22%;width:100%;text-align:center;font-size:18px;text-shadow:0 2px 6px #000}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff9}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,#000a 100%)}
#hit{position:fixed;inset:0;box-shadow:inset 0 0 120px 40px #b3261e;opacity:0;transition:opacity .35s;pointer-events:none;z-index:4}
.tb{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff3;border:2px solid #fff6;display:none;align-items:center;justify-content:center;pointer-events:auto;font-size:11px;color:#fff;text-align:center}
#joy{position:absolute;left:24px;bottom:34px;width:110px;height:110px;border-radius:50%;background:#fff2;display:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff6}
body.touch .tb,body.touch #joy{display:flex}

#lobby.on{display:block;padding:0;overflow:hidden;background:linear-gradient(#2b323d,#6c7078 48%,#8a8b86 62%,#262624)}
.cl{position:absolute;left:0;width:70%;height:26%;border-radius:50%;background:radial-gradient(closest-side,#fff6,#fff0);filter:blur(10px);animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-110%)}to{transform:translateX(160%)}}
#lbx{position:absolute;inset:0;z-index:1;pointer-events:none}#lbx>*{pointer-events:auto;position:absolute}
#ptl{left:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;background:#0007;padding:6px 10px;border-radius:8px}
#ptl input{width:130px;background:transparent;border:0;border-bottom:1px solid #fff5;font-size:17px;font-weight:bold;padding:2px 4px}
#ptr{right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:center}
.chip{width:auto;padding:6px 12px;background:#000a;border:1px solid #fff3;border-radius:16px;font-size:13px;color:var(--ink)}
#lcol{left:12px;bottom:12px;width:min(310px,48%);display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 80px);overflow:auto}
#lcol .pn{background:#0009}#modes button{padding:8px 2px;font-size:12px}.mc{flex:0 0 118px}
.start{background:linear-gradient(#fff200,#ffd400);color:#111;font:900 38px Impact,'Arial Black',sans-serif;letter-spacing:4px;border:0;border-radius:4px;padding:12px;transform:skewX(-6deg);box-shadow:0 0 0 3px #000a,0 0 26px #ffe60066}
#rcol{right:12px;top:calc(56px + env(safe-area-inset-top,0px));width:min(200px,38%);display:flex;flex-direction:column;gap:8px}
.ev{padding:12px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #fff4;background:linear-gradient(120deg,#5a2fb0,#2a1658)}.ev.e2{background:linear-gradient(120deg,#d9a400,#7a5a00)}.ev.e3{background:linear-gradient(120deg,#1769d1,#0a2f66)}
#nav{right:12px;bottom:12px;display:flex;gap:6px}#nav button{width:auto;background:#000a;border:0;border-bottom:3px solid var(--fire);padding:8px 14px;font-size:13px;letter-spacing:1px}
#pop{position:absolute;inset:0;z-index:3;background:#000b;display:flex;align-items:center;justify-content:center}
.pc{position:relative;width:min(420px,92%);background:#120a24;border:2px solid #8a5bff;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px}
.pb{height:150px;border-radius:6px;padding:16px;background:radial-gradient(circle at 70% 30%,#b06bff,#2a1060 60%,#0a0420)}.pb h1{font:900 34px Impact,'Arial Black',sans-serif;color:#fff;text-shadow:0 0 14px #c58bff}
.x{position:absolute;right:0;top:-44px;width:36px;padding:4px;background:transparent;border:0;font-size:26px}
#mm{position:absolute;right:auto;bottom:auto;left:12px;top:calc(52px + env(safe-area-inset-top,0px));width:130px;height:130px;border-radius:50%;border:2px solid #fff5;background:#0a140c;pointer-events:auto}
#mm.big{left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vmin,520px);height:min(88vmin,520px);border-radius:10px;z-index:6}
</style></head><body>
<div class="scr on" id="auth"><div class="card"><img id="lg" alt="" style="width:110px;height:110px;align-self:center"><h1>Rush Survive</h1><small>Raat aayegi. Aag jalti rakho.</small><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ akshar)"><div class="row"><button class="hot" onclick="auth('in')">Login</button><button onclick="auth('up')">Register</button></div><button onclick="guest()">Guest ban ke khelo</button><small id="err" style="color:#ff8a80;min-height:18px"></small></div></div>

<div id="lbx">
<div id="ptl"><div class="av" id="av"><img id="avi" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover"></div><div><input id="nm" maxlength="12" placeholder="Apna naam"><br><small id="st"></small></div></div>
<div id="ptr"><img id="l72" alt="" style="height:26px;border-radius:6px"><span class="chip">Room <b id="code">-</b></span><button class="chip" onclick="logout()">Logout</button></div>
<div id="lcol">

<button class="start" onclick="startGame()">START</button></div>
